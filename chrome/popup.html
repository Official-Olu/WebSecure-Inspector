<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSecure Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="score-container">
      <div id="score" class="score">--</div>
      <div id="rating" class="rating">SCANNING...</div>
    </div>
    <button id="rescan-btn" class="rescan-btn">
      <span>🔄</span> Re-scan
    </button>
  </div>

  <!-- Loading -->
  <div id="scan-status" class="scan-status">
    <div class="loader"></div>
    <span>Analyzing page...</span>
  </div>

  <!-- Results -->
  <div id="results-container" class="results-container" style="display: none;">
    
    <!-- Mixed Content -->
    <div class="category-section" id="mixed-content-section">
      <div class="category-header" onclick="toggleCategory('mixed-content')">
        <div class="category-title">
          <span class="severity-icon severity-high">!</span>
          <span>Mixed Content</span>
        </div>
        <span id="mixed-content-count" class="issue-count">0</span>
      </div>
      <div id="mixed-content-details" class="category-details"></div>
    </div>

    <!-- Unsafe Links -->
    <div class="category-section" id="unsafe-links-section">
      <div class="category-header" onclick="toggleCategory('unsafe-links')">
        <div class="category-title">
          <span class="severity-icon severity-medium">!</span>
          <span>Unsafe Links</span>
        </div>
        <span id="unsafe-links-count" class="issue-count">0</span>
      </div>
      <div id="unsafe-links-details" class="category-details"></div>
    </div>

    <!-- Insecure Storage -->
    <div class="category-section" id="insecure-storage-section">
      <div class="category-header" onclick="toggleCategory('insecure-storage')">
        <div class="category-title">
          <span class="severity-icon severity-critical">!</span>
          <span>Insecure Storage</span>
        </div>
        <span id="insecure-storage-count" class="issue-count">0</span>
      </div>
      <div id="insecure-storage-details" class="category-details"></div>
    </div>

    <!-- CSP -->
    <div class="category-section" id="csp-section">
      <div class="category-header" onclick="toggleCategory('csp')">
        <div class="category-title">
          <span class="severity-icon severity-high">!</span>
          <span>CSP Violations</span>
        </div>
        <span id="csp-count" class="issue-count">0</span>
      </div>
      <div id="csp-details" class="category-details"></div>
    </div>

    <!-- Success Message -->
    <div id="success-message" class="success-message" style="display: none;">
      <div class="success-icon">🎉</div>
      <div class="success-title">Great Security!</div>
      <div class="success-text">Strong security configurations detected.</div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span id="scan-time">Last scan: --</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
